services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: simplebank
      POSTGRES_USER: simplebank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplebank}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplebank -d simplebank"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_HOST: db
      POSTGRES_DB: simplebank
      POSTGRES_USER: simplebank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplebank}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
