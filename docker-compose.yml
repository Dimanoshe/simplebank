x-app: &app
  build:
    context: .
    target: prod
  env_file: .env
  environment:
    POSTGRES_HOST: db
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Runs once before the web server starts
  migrate:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && python manage.py createcachetable"

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  tests:
    <<: *app
    build:
      context: .
      target: dev
    command: pytest
    profiles: [test]

volumes:
  pgdata:
